[tool.poetry]
name = "airecon"
description = "AI-powered security reconnaissance: OpenAI-compatible LLM backend + Kali Linux Docker sandbox + Textual TUI"
version = "1.7.1-beta"
homepage = "https://github.com/pikpikcu/airecon"
license = "MIT"
authors = ["pikpikcu"]
readme = "README.md"
packages = [{include = "airecon"}]
include = [
    "airecon/proxy/skills/**/*.md", 
    "airecon/containers/**/*",
    "airecon/proxy/data/**/*",
    "airecon/proxy/prompts/**/*"
]

[tool.poetry.dependencies]
python = "^3.12"
textual = "^8.0.0"
httpx = "^0.28.1"
fastapi = "^0.133.1"
uvicorn = {extras = ["standard"], version = "^0.41.0"}
sse-starlette = "^3.2.0"
rich = "^14.3.0"
pydantic = "^2.12.5"
playwright = "^1.58.0"
# OpenAI-compatible LLM backend: AIRecon's LLMClient speaks the OpenAI
# /v1/chat/completions wire format directly over httpx (declared above), so the
# heavyweight `openai` SDK is intentionally NOT a dependency. Any OpenAI-compatible
# gateway (LiteLLM / vLLM / hosted / a local gateway) works.
cvss = "^3.6"
duckduckgo-search = "^8.1.0"
aiohttp = "^3.9.0"
defusedxml = "^0.7.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
textual-dev = "^1.7.0"
autopep8 = "^2.3.2"
pytest-cov = "^6.0.0"
pytest-mock = "^3.15.1"
pytest-timeout = "^2.4.0"
hypothesis = "^6.100"
mkdocs-material = "^9.6.7"
pyright = "^1.1.408"

[tool.poetry.scripts]
airecon = "airecon.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["airecon"]
# Exclude integration-heavy files that require Docker/LLM gateway/Playwright at runtime
omit = [
    "airecon/proxy/searxng.py",  # Requires Docker container
]

[tool.coverage.report]
# Current baseline: ~52%. Target: 70% (increase as test coverage grows).
# To raise threshold: write tests for executors.py, loop.py, filesystem.py.
fail_under = 52
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pyright]
include = ["airecon"]
exclude = ["**/__pycache__", ".venv", "venv", "dist", "build"]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportAttributeAccessIssue = true
reportOptionalMemberAccess = true
reportOptionalSubscript = true
reportPrivateImportUsage = true
reportUnboundVariable = true
reportGeneralTypeIssues = true
reportInvalidTypeForm = true

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "venv",
    "dist",
    "build",
    "backup",
    "test_remove_docstrings",
    "**/__pycache__",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
